apiVersion: v1
kind: Service
metadata:
  name: coworking
spec:
  type: LoadBalancer
  selector:
    service: coworking
  ports:
  - name: "5153"
    protocol: TCP
    port: 5153
    targetPort: 5153
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coworking
  labels:
    name: coworking
spec:
  replicas: 1
  selector:
    matchLabels:
      service: coworking
  template:
    metadata:
      labels:
        service: coworking
        image-tag: "${IMAGE_TAG}"
    spec:
      containers:
      - name: coworking
        # Template placeholder: buildspec.yaml runs envsubst to produce rendered/coworking.yaml
        # with the real ECR URI, tagged with the commit SHA. Deploy the rendered file.
        image: ${ECR_IMAGE_URI}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5153
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health_check
            port: 5153
          initialDelaySeconds: 5
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: "/readiness_check"
            port: 5153
          initialDelaySeconds: 5
          timeoutSeconds: 5
        envFrom:
        - configMapRef:
            name: coworking-config
        env:
        - name: IMAGE_TAG
          value: "${IMAGE_TAG}"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: coworking-db-credentials
              key: DB_PASSWORD
      restartPolicy: Always